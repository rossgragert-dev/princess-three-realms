<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Three Realms" />
  <meta name="theme-color" content="#1a1033" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <title>Princess of Three Realms</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1033; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    #rotate { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: none; pointer-events: none; z-index: 5;
      background: rgba(255,246,228,.95); border: 4px solid #a06bff; border-radius: 18px; padding: 8px 14px; transition: opacity .6s; }
    @media (orientation: portrait) { #rotate.show { display: block; } }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- picture-only "turn your iPad sideways" hint; fades after a few seconds and never blocks play -->
  <div id="rotate" aria-hidden="true">
    <svg width="96" height="60" viewBox="0 0 96 60"><rect x="4" y="14" width="30" height="42" rx="5" fill="#fff" stroke="#6a3fc8" stroke-width="4"/>
      <path d="M40 30 Q56 6 74 22" fill="none" stroke="#ffc800" stroke-width="6" stroke-linecap="round"/><path d="M74 8 L76 26 L60 20 Z" fill="#ffc800"/>
      <rect x="50" y="34" width="42" height="26" rx="5" fill="#fff" stroke="#6a3fc8" stroke-width="4" transform="translate(0 -4)"/></svg>
  </div>
  <script>(function(){var r=document.getElementById("rotate");if(window.matchMedia("(orientation: portrait)").matches){r.classList.add("show");setTimeout(function(){r.style.opacity=0},6000)}})()</script>
  <script src="./phaser.min.js"></script><script src="./app.js"></script>
</body>
</html>
